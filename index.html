<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>محاكي الفوال</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #000000;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #game-container {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
      object-fit: contain;
    }

    #orientation-blocker {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #1e272e;
      color: #ffffff;
      z-index: 99999;
      justify-content: center;
      align-items: center;
      text-align: center;
      font-family: system-ui, sans-serif;
      flex-direction: column;
    }
    .phone-icon {
      font-size: 54px;
      margin-bottom: 20px;
      animation: rotatePhone 1.5s infinite ease-in-out alternate;
    }
    @keyframes rotatePhone {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(90deg); }
    }
    @media screen and (orientation: portrait) {
      #orientation-blocker {
        display: flex;
      }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
</head>
<body>

  <div id="orientation-blocker">
    <div class="phone-icon">📱</div>
    <p style="font-size: 22px; font-weight: bold;">الرجاء تدوير الهاتف للوضع العرضي</p>
  </div>

  <div id="game-container"></div>

  <script>
    window.addEventListener('pointerdown', () => {
      if (document.documentElement.requestFullscreen && !document.fullscreenElement) {
        document.documentElement.requestFullscreen().then(() => {
          if (screen.orientation && screen.orientation.lock) {
            screen.orientation.lock('landscape').catch(() => {});
          }
        }).catch(() => {});
      }
    }, { once: true });

    const config = {
      type: Phaser.AUTO,
      parent: 'game-container',
      scale: {
        mode: Phaser.Scale.FIT,
        autoCenter: Phaser.Scale.CENTER_BOTH,
        width: 1280,
        height: 600
      },
      render: {
        pixelArt: false,
        roundPixels: true,
        antialias: true
      },
      resolution: Math.max(window.devicePixelRatio || 1, 2),
      backgroundColor: '#1e272e',
      scene: {
        preload: preload,
        create: create,
        update: update
      }
    };

    const game = new Phaser.Game(config);

    let gameState = {
      money: 50,
      strikes: 0,
      maxStrikes: 3,
      xp: 0,
      selectedCustomerIndex: 0,
      stations: {
        ful: { servings: 5, maxServings: 5, isCooking: false, plateState: 'none' }, // none, empty, filled, covered
        tamees: { doughState: 'none', ovenState: 'empty', readyBread: false }, // doughState: none, ball, flat | ovenState: empty, baking, done
        tea: { cups: 4, maxCups: 4, isBoiling: false, cupState: 'none' } // none, empty, filled
      },
      costs: { refillFul: 5, boilTea: 4 },
      prices: { ful: 4, tamees: 1, tea: 2 }
    };

    let customers = [];
    let uiText;
    let fulViews = {};
    let tameesViews = {};
    let teaViews = {};

    function preload() {
      // البيئة والكاونتر
      this.load.image('bg_restaurant', 'environment/sprite-bg.jpg');
      this.load.image('counter_metal', 'environment/sprite-counter.png');

      // الفول (المسارات الجديدة)
      this.load.image('fuwl_oven_empty', 'fuwl_sprites/fuwl-oven_empty.png');
      this.load.image('fuwl_oven_cooking', 'fuwl_sprites/fuwl-oven_cooking.png');
      this.load.image('fuwl_oven_cooked', 'fuwl_sprites/fuwl-oven_cooked.png');
      this.load.image('fuwl_bowl_pack', 'fuwl_sprites/fuwl-bowl_pack.png');
      this.load.image('fuwl_bowl_empty', 'fuwl_sprites/fuwl-bowl_empty.png');
      this.load.image('fuwl_bowl_filled', 'fuwl_sprites/fuwl-bowl_filled.png');
      this.load.image('fuwl_cover_pack', 'fuwl_sprites/fuwl-cover_pack.png');
      this.load.image('fuwl_bowl_covered', 'fuwl_sprites/fuwl-bowl_covered.png');

      // التميس (المسارات الجديدة)
      this.load.image('tamees_dough_box', 'tamees_sprites/tamees-dough_box.png');
      this.load.image('tamees_dough_ball', 'tamees_sprites/tamees-dough.png');
      this.load.image('tamees_dough_flat', 'tamees_sprites/Tamees-dough_straightened.png');
      this.load.image('tamees_oven_empty', 'tamees_sprites/tamees-oven_empty.png');
      this.load.image('tamees_oven_cooking', 'tamees_sprites/tamees-oven_cooking.png');
      this.load.image('tamees_oven_done', 'tamees_sprites/tamees-oven_done.png');
      this.load.image('tamees_cooked', 'tamees_sprites/tamees-cooked.png');

      // الشاي (المسارات الجديدة)
      this.load.image('tea_pot_empty', 'tea_sprites/tea-pot_empty.png');
      this.load.image('tea_pot_filled', 'tea_sprites/tea-pot_filled.png');
      this.load.image('tea_cup_pack', 'tea_sprites/tea-cup_pack.png');
      this.load.image('tea_cup_empty', 'tea_sprites/tea-cup_empty.png');
      this.load.image('tea_cup_filled', 'tea_sprites/tea-cup_filled.png');

      // الزبائن (المسارات الجديدة)
      this.load.image('girl_happy', 'characters/girl-happy.png');
      this.load.image('girl_neutral', 'characters/girl-nutural.png'); // الانتباه للاسم nutural
      this.load.image('girl_angry', 'characters/girl-angry.png');
      this.load.image('man_happy', 'characters/man-happy.png');
      this.load.image('man_neutral', 'characters/man-nutural.png'); // الانتباه للاسم nutural
      this.load.image('man_angry', 'characters/man-angry.png');
    }

    function applySquash(scene, target) {
      scene.tweens.add({
        targets: target,
        scaleX: target.scaleX * 0.9,
        scaleY: target.scaleY * 0.9,
        duration: 70,
        yoyo: true
      });
    }

    function showFloatingText(scene, x, y, msg, color) {
      let t = scene.add.text(x, y, msg, {
        fontSize: '22px', fontStyle: 'bold', fill: color, stroke: '#000', strokeThickness: 4
      }).setDepth(30).setOrigin(0.5);
      
      scene.tweens.add({
        targets: t,
        y: y - 50,
        alpha: 0,
        duration: 1100,
        ease: 'Cubic.easeOut',
        onComplete: () => t.destroy()
      });
    }

    function showProgressBar(scene, x, y, width, duration, color, callback) {
      let bg = scene.add.rectangle(x, y, width, 10, 0x000000, 0.85).setOrigin(0).setDepth(20);
      let bar = scene.add.rectangle(x + 2, y + 2, 0, 6, color).setOrigin(0).setDepth(21);
      
      scene.tweens.add({
        targets: bar,
        width: width - 4,
        duration: duration,
        onComplete: () => {
          bg.destroy();
          bar.destroy();
          if (callback) callback();
        }
      });
    }

    function create() {
      const scene = this;
      window.addEventListener('resize', () => scene.scale.refresh());

      scene.add.image(640, 300, 'bg_restaurant').setDisplaySize(1280, 600).setDepth(0);

      for (let i = 0; i < 3; i++) spawnCustomer(scene, i);

      scene.add.image(640, 520, 'counter_metal').setDisplaySize(1280, 160).setDepth(2);

      scene.add.rectangle(640, 25, 1280, 50, 0x1e272e, 0.85).setDepth(10);
      uiText = scene.add.text(20, 14, '', { fontFamily: 'system-ui, sans-serif', fontSize: '20px', fontStyle: 'bold', fill: '#ffffff' }).setDepth(11);
      updateUI();

      setupFulStation(scene);
      setupTameesStation(scene);
      setupTeaStation(scene);

      updateCustomerSelectionVisuals();
    }

    function update(time, delta) {
      customers.forEach((cust, index) => {
        if (!cust || !cust.active) return;
        
        cust.patience -= delta * 0.005;
        let p = (cust.patience / 100);
        cust.patienceBar.width = Math.max(0, p * 100);

        if (p > 0.6) {
          cust.patienceBar.fillColor = 0x2ed573;
          if (cust.emotion !== 'happy') {
            cust.sprite.setTexture(`${cust.type}_happy`);
            cust.emotion = 'happy';
          }
        } else if (p > 0.25) {
          cust.patienceBar.fillColor = 0xffa502;
          if (cust.emotion !== 'neutral') {
            cust.sprite.setTexture(`${cust.type}_neutral`);
            cust.emotion = 'neutral';
          }
        } else {
          cust.patienceBar.fillColor = 0xff4757;
          if (cust.emotion !== 'angry') {
            cust.sprite.setTexture(`${cust.type}_angry`);
            cust.emotion = 'angry';
          }
        }

        if (cust.patience <= 0) custFailed(this, index);
      });
    }

    function updateUI() {
      uiText.setText(`الرصيد: ${gameState.money} ريال  |  الأخطاء: ${gameState.strikes}/${gameState.maxStrikes}  |  الخبرة: ${gameState.xp}`);
    }

    // ==========================================
    // محطة الفول
    // ==========================================
    function setupFulStation(scene) {
      fulViews.pot = scene.add.image(185, 450, 'fuwl_oven_cooked').setDisplaySize(115, 140).setDepth(5).setInteractive({ useHandCursor: true });
      fulViews.label = scene.add.text(185, 535, 'الجرة: 5/5', { fontSize: '14px', fontStyle: 'bold', fill: '#ffffff', stroke: '#000', strokeThickness: 3 }).setOrigin(0.5).setDepth(6);
      
      fulViews.bowlPack = scene.add.image(280, 480, 'fuwl_bowl_pack').setDisplaySize(55, 60).setDepth(5).setInteractive({ useHandCursor: true });
      fulViews.coverPack = scene.add.image(350, 485, 'fuwl_cover_pack').setDisplaySize(55, 45).setDepth(5).setInteractive({ useHandCursor: true });
      
      fulViews.plate = scene.add.image(420, 485, 'fuwl_bowl_empty').setDisplaySize(65, 50).setDepth(5).setVisible(false).setInteractive({ useHandCursor: true });

      // الضغط على الجرة للطبخ
      fulViews.pot.on('pointerdown', () => {
        applySquash(scene, fulViews.pot);
        const ful = gameState.stations.ful;
        if (!ful.isCooking && ful.servings < ful.maxServings) {
          if (gameState.money >= gameState.costs.refillFul) {
            gameState.money -= gameState.costs.refillFul;
            ful.isCooking = true;
            updateUI();
            showFloatingText(scene, 185, 410, '-5 ريال', '#ff4757');
            
            fulViews.pot.setTexture('fuwl_oven_cooking');
            let shake = scene.tweens.add({ targets: fulViews.pot, angle: { from: -2, to: 2 }, duration: 100, yoyo: true, repeat: -1 });
            
            showProgressBar(scene, 140, 390, 90, 3000, 0xe74c3c, () => {
              shake.stop();
              fulViews.pot.angle = 0;
              ful.servings = ful.maxServings;
              ful.isCooking = false;
              updateFulVisuals();
            });
          } else {
            showFloatingText(scene, 185, 410, 'لا يوجد رصيد!', '#ff4757');
          }
        }
      });

      // الضغط على رصة العلب لإنزال علبة فارغة
      fulViews.bowlPack.on('pointerdown', () => {
        applySquash(scene, fulViews.bowlPack);
        if (gameState.stations.ful.plateState === 'none') {
          gameState.stations.ful.plateState = 'empty';
          updateFulVisuals();
        }
      });

      // الضغط على رصة الأغطية لتغطية العلبة المعبأة
      fulViews.coverPack.on('pointerdown', () => {
        applySquash(scene, fulViews.coverPack);
        if (gameState.stations.ful.plateState === 'filled') {
          gameState.stations.ful.plateState = 'covered';
          updateFulVisuals();
        }
      });

      // الضغط على صحن الفول المجهز (الغرف أو التسليم)
      fulViews.plate.on('pointerdown', () => {
        applySquash(scene, fulViews.plate);
        const ful = gameState.stations.ful;
        if (ful.plateState === 'empty') {
          if (ful.servings > 0 && !ful.isCooking) {
            ful.plateState = 'scooping'; // حالة مؤقتة
            let shake = scene.tweens.add({ targets: fulViews.pot, y: fulViews.pot.y - 4, duration: 80, yoyo: true, repeat: -1 });
            showProgressBar(scene, 380, 440, 80, 1200, 0xf1c40f, () => {
              shake.stop();
              fulViews.pot.y = 450;
              ful.servings--;
              ful.plateState = 'filled';
              updateFulVisuals();
            });
          }
        } else if (ful.plateState === 'covered') { // يجب أن يكون مغطى للتسليم
          deliverItem(scene, 'ful', () => {
            ful.plateState = 'none';
            updateFulVisuals();
          });
        } else if (ful.plateState === 'filled') {
          showFloatingText(scene, 420, 440, 'غطِّ العلبة!', '#f39c12');
        }
      });

      updateFulVisuals();
    }

    function updateFulVisuals() {
      const ful = gameState.stations.ful;
      if (ful.servings > 0) {
        fulViews.pot.setTexture('fuwl_oven_cooked');
      } else {
        fulViews.pot.setTexture(ful.isCooking ? 'fuwl_oven_cooking' : 'fuwl_oven_empty');
      }
      fulViews.label.setText(`الجرة: ${ful.servings}/${ful.maxServings}`);

      if (ful.plateState === 'none') {
        fulViews.plate.setVisible(false);
      } else if (ful.plateState === 'empty' || ful.plateState === 'scooping') {
        fulViews.plate.setVisible(true).setTexture('fuwl_bowl_empty').setDisplaySize(65, 50);
      } else if (ful.plateState === 'filled') {
        fulViews.plate.setVisible(true).setTexture('fuwl_bowl_filled').setDisplaySize(65, 50);
      } else if (ful.plateState === 'covered') {
        fulViews.plate.setVisible(true).setTexture('fuwl_bowl_covered').setDisplaySize(65, 55);
      }
    }

    // ==========================================
    // محطة التميس
    // ==========================================
    function setupTameesStation(scene) {
      tameesViews.box = scene.add.image(540, 480, 'tamees_dough_box').setDisplaySize(85, 65).setDepth(5).setInteractive({ useHandCursor: true });
      tameesViews.prep = scene.add.image(620, 480, 'tamees_dough_ball').setDisplaySize(60, 50).setDepth(5).setVisible(false).setInteractive({ useHandCursor: true });
      tameesViews.oven = scene.add.image(725, 455, 'tamees_oven_empty').setDisplaySize(125, 115).setDepth(5).setInteractive({ useHandCursor: true });
      tameesViews.readyBread = scene.add.image(815, 480, 'tamees_cooked').setDisplaySize(85, 75).setDepth(5).setVisible(false).setInteractive({ useHandCursor: true });

      tameesViews.box.on('pointerdown', () => {
        applySquash(scene, tameesViews.box);
        if (gameState.stations.tamees.doughState === 'none') {
          gameState.stations.tamees.doughState = 'ball';
          updateTameesVisuals();
        }
      });

      tameesViews.prep.on('pointerdown', () => {
        applySquash(scene, tameesViews.prep);
        const t = gameState.stations.tamees;
        if (t.doughState === 'ball') {
          t.doughState = 'flat';
          updateTameesVisuals();
        } else if (t.doughState === 'flat') {
          if (t.ovenState === 'empty') {
            t.doughState = 'none';
            t.ovenState = 'baking';
            updateTameesVisuals();
            showProgressBar(scene, 680, 390, 90, 2500, 0xe67e22, () => {
              t.ovenState = 'done';
              updateTameesVisuals();
            });
          }
        }
      });

      tameesViews.oven.on('pointerdown', () => {
        applySquash(scene, tameesViews.oven);
        const t = gameState.stations.tamees;
        if (t.ovenState === 'done' && !t.readyBread) {
          t.ovenState = 'empty';
          t.readyBread = true;
          updateTameesVisuals();
        }
      });

      tameesViews.readyBread.on('pointerdown', () => {
        applySquash(scene, tameesViews.readyBread);
        deliverItem(scene, 'tamees', () => {
          gameState.stations.tamees.readyBread = false;
          updateTameesVisuals();
        });
      });

      updateTameesVisuals();
    }

    function updateTameesVisuals() {
      const t = gameState.stations.tamees;
      
      if (t.doughState === 'none') {
        tameesViews.prep.setVisible(false);
      } else if (t.doughState === 'ball') {
        tameesViews.prep.setVisible(true).setTexture('tamees_dough_ball').setDisplaySize(55, 45);
      } else if (t.doughState === 'flat') {
        tameesViews.prep.setVisible(true).setTexture('tamees_dough_flat').setDisplaySize(75, 45);
      }

      if (t.ovenState === 'baking') {
        tameesViews.oven.setTexture('tamees_oven_cooking');
      } else if (t.ovenState === 'done') {
        tameesViews.oven.setTexture('tamees_oven_done');
      } else {
        tameesViews.oven.setTexture('tamees_oven_empty');
      }

      tameesViews.readyBread.setVisible(t.readyBread);
    }

    // ==========================================
    // محطة الشاي
    // ==========================================
    function setupTeaStation(scene) {
      teaViews.pot = scene.add.image(945, 465, 'tea_pot_filled').setDisplaySize(95, 105).setDepth(5).setInteractive({ useHandCursor: true });
      teaViews.label = scene.add.text(945, 535, 'براد: 4/4', { fontSize: '14px', fontStyle: 'bold', fill: '#ffffff', stroke: '#000', strokeThickness: 3 }).setOrigin(0.5).setDepth(6);
      
      teaViews.stack = scene.add.image(1030, 480, 'tea_cup_pack').setDisplaySize(50, 75).setDepth(5).setInteractive({ useHandCursor: true });
      teaViews.cup = scene.add.image(1095, 475, 'tea_cup_empty').setDisplaySize(50, 65).setDepth(5).setVisible(false).setInteractive({ useHandCursor: true });

      teaViews.pot.on('pointerdown', () => {
        applySquash(scene, teaViews.pot);
        const tea = gameState.stations.tea;
        if (!tea.isBoiling && tea.cups < tea.maxCups) {
          if (gameState.money >= gameState.costs.boilTea) {
            gameState.money -= gameState.costs.boilTea;
            tea.isBoiling = true;
            updateUI();
            showFloatingText(scene, 945, 410, '-4 ريال', '#ff4757');
            let shake = scene.tweens.add({ targets: teaViews.pot, angle: { from: -3, to: 3 }, duration: 80, yoyo: true, repeat: -1 });

            showProgressBar(scene, 900, 395, 90, 2500, 0x3498db, () => {
              shake.stop();
              teaViews.pot.angle = 0;
              tea.cups = tea.maxCups;
              tea.isBoiling = false;
              updateTeaVisuals();
            });
          } else {
            showFloatingText(scene, 945, 410, 'لا يوجد رصيد!', '#ff4757');
          }
        }
      });

      teaViews.stack.on('pointerdown', () => {
        applySquash(scene, teaViews.stack);
        if (gameState.stations.tea.cupState === 'none') {
          gameState.stations.tea.cupState = 'empty';
          updateTeaVisuals();
        }
      });

      teaViews.cup.on('pointerdown', () => {
        applySquash(scene, teaViews.cup);
        const tea = gameState.stations.tea;
        if (tea.cupState === 'empty') {
          if (tea.cups > 0 && !tea.isBoiling) {
            tea.cupState = 'pouring'; // حالة مؤقتة
            let tilt = scene.tweens.add({ targets: teaViews.pot, angle: -15, duration: 200, yoyo: true });
            showProgressBar(scene, 1050, 430, 75, 1000, 0x16a085, () => {
              tea.cups--;
              tea.cupState = 'filled';
              updateTeaVisuals();
            });
          }
        } else if (tea.cupState === 'filled') {
          deliverItem(scene, 'tea', () => {
            tea.cupState = 'none';
            updateTeaVisuals();
          });
        }
      });

      updateTeaVisuals();
    }

    function updateTeaVisuals() {
      const tea = gameState.stations.tea;
      teaViews.pot.setTexture(tea.cups > 0 ? 'tea_pot_filled' : 'tea_pot_empty');
      teaViews.label.setText(`براد: ${tea.cups}/${tea.maxCups}`);

      if (tea.cupState === 'none') {
        teaViews.cup.setVisible(false);
      } else if (tea.cupState === 'empty' || tea.cupState === 'pouring') {
        teaViews.cup.setVisible(true).setTexture('tea_cup_empty');
      } else if (tea.cupState === 'filled') {
        teaViews.cup.setVisible(true).setTexture('tea_cup_filled');
      }
    }

    // ==========================================
    // إدارة الزبائن وتحديد الخدمة والتسليم
    // ==========================================
    function spawnCustomer(scene, slotIndex) {
      const x = 280 + slotIndex * 360; 
      const y = 300;
      const charTypes = ['girl', 'man'];
      const type = charTypes[Math.floor(Math.random() * charTypes.length)];
      const menuOptions = ['ful', 'tamees', 'tea'];
      const chosenItem = menuOptions[Math.floor(Math.random() * menuOptions.length)];

      const sprite = scene.add.image(x, y + 40, `${type}_happy`).setDisplaySize(175, 410).setDepth(1);
      scene.tweens.add({ targets: sprite, y: y, alpha: 1, duration: 400, ease: 'Back.easeOut' });

      const bubbleBg = scene.add.rectangle(x, y - 160, 120, 110, 0xffffff, 0.95).setStrokeStyle(3, 0x000000).setDepth(3);
      const tail = scene.add.triangle(x, y - 105, 0, -8, 12, 8, -12, 8, 0xffffff).setStrokeStyle(3, 0x000000).setDepth(2.9);

      let orderKey = chosenItem === 'tamees' ? 'tamees_cooked' : (chosenItem === 'tea' ? 'tea_cup_filled' : 'fuwl_bowl_covered');
      const orderPreview = scene.add.image(x, y - 160, orderKey).setDisplaySize(48, 48).setDepth(4);

      const pBarBg = scene.add.rectangle(x - 45, y - 120, 90, 8, 0x1e272e).setOrigin(0, 0.5).setDepth(4);
      const patienceBar = scene.add.rectangle(x - 45, y - 120, 90, 8, 0x2ed573).setOrigin(0, 0.5).setDepth(4);

      const selectIndicator = scene.add.triangle(x, y - 225, 0, 15, -12, 0, 12, 0, 0xf1c40f).setDepth(10).setVisible(false);

      const hitbox = scene.add.rectangle(x, y - 60, 150, 260, 0x000000, 0).setInteractive({ useHandCursor: true }).setDepth(4);
      hitbox.on('pointerdown', () => {
        gameState.selectedCustomerIndex = slotIndex;
        updateCustomerSelectionVisuals();
      });

      customers[slotIndex] = {
        active: true, slotIndex, type, sprite, emotion: 'happy', order: chosenItem, patience: 100,
        bubbleBg, tail, orderPreview, pBarBg, patienceBar, selectIndicator, hitbox
      };
    }

    function updateCustomerSelectionVisuals() {
      customers.forEach((cust, idx) => {
        if (!cust || !cust.active) return;
        const isSelected = (idx === gameState.selectedCustomerIndex);
        cust.selectIndicator.setVisible(isSelected);
        cust.bubbleBg.setStrokeStyle(isSelected ? 5 : 3, isSelected ? 0xf1c40f : 0x000000);
      });
    }

    function deliverItem(scene, itemType, onConsumed) {
      const idx = gameState.selectedCustomerIndex;
      const cust = customers[idx];

      if (!cust || !cust.active) {
        showFloatingText(scene, 640, 280, 'اختر زبوناً أولاً!', '#f1c40f');
        return;
      }

      onConsumed();

      if (cust.order === itemType) {
        let earned = (itemType === 'ful') ? 6 : ((itemType === 'tamees') ? 1 : 2);
        let payout = Math.max(1, Math.round(earned * (cust.patience / 100)));
        gameState.money += payout;
        gameState.xp += 10;
        updateUI();

        cust.sprite.setTexture(`${cust.type}_happy`);
        scene.tweens.add({ targets: cust.sprite, y: cust.sprite.y - 25, duration: 150, yoyo: true, repeat: 1 });
        showFloatingText(scene, cust.sprite.x, cust.sprite.y - 120, `+${payout} ريال`, '#2ecc71');

        clearCustomer(scene, idx);
        scene.time.delayedCall(1200, () => {
          spawnCustomer(scene, idx);
          updateCustomerSelectionVisuals();
        });
      } else {
        cust.patience = Math.max(0, cust.patience - 25);
        scene.cameras.main.shake(150, 0.012);
        showFloatingText(scene, cust.sprite.x, cust.sprite.y - 120, 'طلب خاطئ!', '#ff4757');
      }
    }

    function custFailed(scene, slotIndex) {
      const cust = customers[slotIndex];
      cust.sprite.setTexture(`${cust.type}_angry`);
      scene.tweens.add({ targets: cust.sprite, y: cust.sprite.y + 90, alpha: 0, duration: 500, ease: 'Power2' });
      clearCustomer(scene, slotIndex, true);

      gameState.strikes++;
      updateUI();
      scene.cameras.main.flash(300, 255, 0, 0);

      if (gameState.strikes >= gameState.maxStrikes) {
        scene.cameras.main.fade(1000, 0, 0, 0);
        scene.time.delayedCall(1200, () => location.reload());
      } else {
        scene.time.delayedCall(1400, () => {
          spawnCustomer(scene, slotIndex);
          updateCustomerSelectionVisuals();
        });
      }
    }

    function clearCustomer(scene, slotIndex, keepSprite = false) {
      const cust = customers[slotIndex];
      if (!cust) return;
      cust.active = false;
      cust.bubbleBg.destroy();
      cust.tail.destroy();
      cust.orderPreview.destroy();
      cust.pBarBg.destroy();
      cust.patienceBar.destroy();
      cust.selectIndicator.destroy();
      cust.hitbox.destroy();

      if (!keepSprite) {
        scene.tweens.add({ targets: cust.sprite, alpha: 0, duration: 250, onComplete: () => cust.sprite.destroy() });
      }
    }
  </script>
</body>
