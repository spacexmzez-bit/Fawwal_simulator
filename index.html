<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>محاكي الفوال</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #1a1a1a;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #game-container {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      display: block;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
</head>
<body>
  <div id="game-container"></div>

  <script>
    const config = {
      type: Phaser.AUTO,
      parent: 'game-container',
      scale: {
        mode: Phaser.Scale.FIT,
        autoCenter: Phaser.Scale.CENTER_BOTH,
        width: 960,
        height: 600
      },
      render: {
        pixelArt: false,
        roundPixels: true,
        antialias: true
      },
      resolution: Math.max(window.devicePixelRatio || 1, 2),
      backgroundColor: '#2d3436',
      scene: {
        preload: preload,
        create: create,
        update: update
      }
    };

    const game = new Phaser.Game(config);

    let gameState = {
      money: 50,
      strikes: 0,
      maxStrikes: 3,
      xp: 0,
      stations: {
        ful: { readyPlates: 0, remainingServings: 5, maxServings: 5, isCooking: false, isScooping: false },
        tamees: { doughReady: false, inOvenCount: 0, readyBread: 0, maxOven: 2 },
        tea: { cupsReady: 0, remainingCups: 4, maxCups: 4, isBoiling: false }
      },
      costs: { refillFul: 5, boilTea: 4 },
      prices: {
        ful: { base: 4, olive_oil: 2 },
        tamees: { base: 1 },
        tea: { base: 2 }
      }
    };

    let customers = [];
    let uiText;

    function preload() {}

    function create() {
      const scene = this;

      // تحديث مقاسات الكانفاس فوراً لو تغير وضع سطح المكتب / الجوال
      window.addEventListener('resize', () => {
        scene.scale.refresh();
      });

      // شريط المعلومات العلوي
      uiText = scene.add.text(20, 20, '', {
        fontFamily: 'system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif',
        fontSize: '22px',
        fontStyle: 'bold',
        fill: '#ffffff'
      });
      updateUI();

      // رسم المحطات الثلاث
      createFulStation(scene, 60, 380);
      createTameesStation(scene, 360, 380);
      createTeaStation(scene, 660, 380);

      // رسم خانات الزبائن الثلاث
      for (let i = 0; i < 3; i++) {
        spawnCustomer(scene, i);
      }
    }

    function update(time, delta) {
      customers.forEach((cust, index) => {
        if (!cust || !cust.active) return;
        cust.patience -= delta * 0.005;
        cust.patienceBar.width = Math.max(0, (cust.patience / 100) * 160);

        if (cust.patience <= 0) {
          custFailed(this, index);
        }
      });
    }

    function updateUI() {
      uiText.setText(`الرصيد: ${gameState.money} ريال  |  الأخطاء: ${gameState.strikes}/${gameState.maxStrikes}  |  الخبرة: ${gameState.xp}`);
    }

    // --- محطة الفول ---
    function createFulStation(scene, x, y) {
      scene.add.rectangle(x, y, 240, 180, 0x574b90).setOrigin(0);
      scene.add.text(x + 15, y + 15, 'محطة الفول', { fontSize: '18px', fontStyle: 'bold', fill: '#fff' });

      const statusText = scene.add.text(x + 15, y + 50, '', { fontSize: '15px', fill: '#dcdde1' });

      function updateFulText() {
        statusText.setText(`الجرة: ${gameState.stations.ful.remainingServings}/${gameState.stations.ful.maxServings}\nصحون جاهزة: ${gameState.stations.ful.readyPlates}`);
      }
      updateFulText();

      // غرف
      const scoopBtn = scene.add.rectangle(x + 15, y + 110, 100, 50, 0xf39c12).setOrigin(0).setInteractive({ useHandCursor: true });
      const scoopLabel = scene.add.text(x + 30, y + 125, 'غرف فول', { fontSize: '15px', fontStyle: 'bold', fill: '#000' });

      scoopBtn.on('pointerdown', () => {
        const ful = gameState.stations.ful;
        if (ful.remainingServings > 0 && !ful.isScooping && !ful.isCooking) {
          ful.isScooping = true;
          scoopLabel.setText('جاري...');
          scene.time.delayedCall(1500, () => {
            ful.remainingServings--;
            ful.readyPlates++;
            ful.isScooping = false;
            scoopLabel.setText('غرف فول');
            updateFulText();
          });
        }
      });

      // طبخ
      const cookBtn = scene.add.rectangle(x + 125, y + 110, 100, 50, 0xc0392b).setOrigin(0).setInteractive({ useHandCursor: true });
      const cookLabel = scene.add.text(x + 135, y + 125, 'طبخ (5ر)', { fontSize: '15px', fontStyle: 'bold', fill: '#fff' });

      cookBtn.on('pointerdown', () => {
        const ful = gameState.stations.ful;
        if (!ful.isCooking && gameState.money >= gameState.costs.refillFul) {
          gameState.money -= gameState.costs.refillFul;
          ful.isCooking = true;
          cookLabel.setText('يطبخ...');
          updateUI();
          scene.time.delayedCall(3000, () => {
            ful.remainingServings = ful.maxServings;
            ful.isCooking = false;
            cookLabel.setText('طبخ (5ر)');
            updateFulText();
          });
        }
      });
    }

    // --- محطة التميس ---
    function createTameesStation(scene, x, y) {
      scene.add.rectangle(x, y, 240, 180, 0x27ae60).setOrigin(0);
      scene.add.text(x + 15, y + 15, 'محطة التميس', { fontSize: '18px', fontStyle: 'bold', fill: '#fff' });

      const statusText = scene.add.text(x + 15, y + 50, '', { fontSize: '15px', fill: '#dcdde1' });
      function updateTameesText() {
        statusText.setText(`عجين مفرود: ${gameState.stations.tamees.doughReady ? 'جاهز' : 'لا يوجد'}\nتميس جاهز: ${gameState.stations.tamees.readyBread}`);
      }
      updateTameesText();

      // عجن
      const kneadBtn = scene.add.rectangle(x + 15, y + 110, 100, 50, 0xe67e22).setOrigin(0).setInteractive({ useHandCursor: true });
      scene.add.text(x + 25, y + 125, 'عجن وفرد', { fontSize: '15px', fontStyle: 'bold', fill: '#000' });

      kneadBtn.on('pointerdown', () => {
        gameState.stations.tamees.doughReady = true;
        updateTameesText();
      });

      // تنور
      const bakeBtn = scene.add.rectangle(x + 125, y + 110, 100, 50, 0xd35400).setOrigin(0).setInteractive({ useHandCursor: true });
      const bakeLabel = scene.add.text(x + 140, y + 125, 'للتنور', { fontSize: '15px', fontStyle: 'bold', fill: '#fff' });

      bakeBtn.on('pointerdown', () => {
        const tamees = gameState.stations.tamees;
        if (tamees.doughReady && tamees.inOvenCount < tamees.maxOven) {
          tamees.doughReady = false;
          tamees.inOvenCount++;
          bakeLabel.setText('يخبز...');
          updateTameesText();

          scene.time.delayedCall(2500, () => {
            tamees.inOvenCount--;
            tamees.readyBread++;
            bakeLabel.setText('للتنور');
            updateTameesText();
          });
        }
      });
    }

    // --- محطة الشاي ---
    function createTeaStation(scene, x, y) {
      scene.add.rectangle(x, y, 240, 180, 0x2980b9).setOrigin(0);
      scene.add.text(x + 15, y + 15, 'محطة الشاي', { fontSize: '18px', fontStyle: 'bold', fill: '#fff' });

      const statusText = scene.add.text(x + 15, y + 50, '', { fontSize: '15px', fill: '#dcdde1' });
      function updateTeaText() {
        statusText.setText(`أكواب البراد: ${gameState.stations.tea.remainingCups}/${gameState.stations.tea.maxCups}\nأكواب جاهزة: ${gameState.stations.tea.cupsReady}`);
      }
      updateTeaText();

      // صب
      const pourBtn = scene.add.rectangle(x + 15, y + 110, 100, 50, 0x16a085).setOrigin(0).setInteractive({ useHandCursor: true });
      scene.add.text(x + 35, y + 125, 'صب كوب', { fontSize: '15px', fontStyle: 'bold', fill: '#000' });

      pourBtn.on('pointerdown', () => {
        const tea = gameState.stations.tea;
        if (tea.remainingCups > 0 && !tea.isBoiling) {
          tea.remainingCups--;
          tea.cupsReady++;
          updateTeaText();
        }
      });

      // غليان
      const boilBtn = scene.add.rectangle(x + 125, y + 110, 100, 50, 0xc0392b).setOrigin(0).setInteractive({ useHandCursor: true });
      const boilLabel = scene.add.text(x + 135, y + 125, 'غليان (4ر)', { fontSize: '15px', fontStyle: 'bold', fill: '#fff' });

      boilBtn.on('pointerdown', () => {
        const tea = gameState.stations.tea;
        if (!tea.isBoiling && gameState.money >= gameState.costs.boilTea) {
          gameState.money -= gameState.costs.boilTea;
          tea.isBoiling = true;
          boilLabel.setText('يغلي...');
          updateUI();
          scene.time.delayedCall(2500, () => {
            tea.remainingCups = tea.maxCups;
            tea.isBoiling = false;
            boilLabel.setText('غليان (4ر)');
            updateTeaText();
          });
        }
      });
    }

    // --- الزبائن ---
    function spawnCustomer(scene, slotIndex) {
      const x = 60 + slotIndex * 300;
      const y = 80;

      const menuOptions = ['ful', 'tamees', 'tea'];
      const chosenItem = menuOptions[Math.floor(Math.random() * menuOptions.length)];

      const box = scene.add.rectangle(x, y, 240, 240, 0x34495e).setOrigin(0);
      const label = scene.add.text(x + 20, y + 20, `زبون #${slotIndex + 1}\nالطلب:\n${getArabicName(chosenItem)}`, {
        fontSize: '18px',
        lineSpacing: 8,
        fontStyle: 'bold',
        fill: '#ffffff'
      });

      const barBg = scene.add.rectangle(x + 20, y + 110, 160, 16, 0x2c3e50).setOrigin(0);
      const patienceBar = scene.add.rectangle(x + 20, y + 110, 160, 16, 0x2ecc71).setOrigin(0);

      const serveBtn = scene.add.rectangle(x + 20, y + 150, 160, 50, 0x3498db).setOrigin(0).setInteractive({ useHandCursor: true });
      const serveText = scene.add.text(x + 45, y + 165, 'تسليم الطلب', { fontSize: '16px', fontStyle: 'bold', fill: '#ffffff' });

      const customerData = {
        active: true,
        order: chosenItem,
        patience: 100,
        box,
        label,
        barBg,
        patienceBar,
        serveBtn,
        serveText
      };

      serveBtn.on('pointerdown', () => {
        attemptDelivery(scene, slotIndex);
      });

      customers[slotIndex] = customerData;
    }

    function getArabicName(item) {
      if (item === 'ful') return 'صحن فول بزيت';
      if (item === 'tamees') return 'رغيف تميس';
      if (item === 'tea') return 'كوب شاي';
      return item;
    }

    function attemptDelivery(scene, slotIndex) {
      const cust = customers[slotIndex];
      if (!cust || !cust.active) return;

      let isSuccess = false;
      let earned = 0;

      if (cust.order === 'ful' && gameState.stations.ful.readyPlates > 0) {
        gameState.stations.ful.readyPlates--;
        earned = gameState.prices.ful.base + gameState.prices.ful.olive_oil;
        isSuccess = true;
      } else if (cust.order === 'tamees' && gameState.stations.tamees.readyBread > 0) {
        gameState.stations.tamees.readyBread--;
        earned = gameState.prices.tamees.base;
        isSuccess = true;
      } else if (cust.order === 'tea' && gameState.stations.tea.cupsReady > 0) {
        gameState.stations.tea.cupsReady--;
        earned = gameState.prices.tea.base;
        isSuccess = true;
      }

      if (isSuccess) {
        const payout = Math.round(earned * (cust.patience / 100));
        gameState.money += Math.max(1, payout);
        gameState.xp += 10;
        updateUI();
        clearCustomer(slotIndex);
        scene.time.delayedCall(1000, () => spawnCustomer(scene, slotIndex));
      } else {
        cust.patience = Math.max(0, cust.patience - 25);
      }
    }

    function custFailed(scene, slotIndex) {
      clearCustomer(slotIndex);
      gameState.strikes++;
      updateUI();

      if (gameState.strikes >= gameState.maxStrikes) {
        alert('انتهت دورة اللعب! غضب 3 زبائن.');
        location.reload();
      } else {
        scene.time.delayedCall(1200, () => spawnCustomer(scene, slotIndex));
      }
    }

    function clearCustomer(slotIndex) {
      const cust = customers[slotIndex];
      if (!cust) return;
      cust.active = false;
      cust.box.destroy();
      cust.label.destroy();
      cust.barBg.destroy();
      cust.patienceBar.destroy();
      cust.serveBtn.destroy();
      cust.serveText.destroy();
    }
  </script>
</body>
</html>
